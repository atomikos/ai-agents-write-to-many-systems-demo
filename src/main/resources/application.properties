# PostgreSQL through its XA driver, so it can join distributed transactions.
# The server needs max_prepared_transactions > 0 (see docker-compose.yml).
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.xa.data-source-class-name=org.postgresql.xa.PGXADataSource
spring.jta.atomikos.datasource.max-pool-size=10

# Artemis broker; Spring Boot creates an XA ConnectionFactory for it
spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=artemis
spring.artemis.password=artemis
spring.jta.atomikos.connectionfactory.max-pool-size=10

# creates the tables and seeds a few orders (schema.sql is idempotent)
spring.sql.init.mode=always

# Atomikos transaction log: this is what makes crash recovery possible,
# so it must survive a restart (do not put it in a temp directory)
atomikos.properties.log-base-dir=transaction-logs

# --- demo settings ---
# Base URL of the CRM. Empty = the fake CRM served by this same application.
crm.base-url=
# A saga still PENDING after this long belongs to a crashed attempt and gets compensated.
# Must be longer than the CRM call timeout plus the XA transaction timeout.
refund.saga.stale-after=30s
refund.saga.sweep-interval=5s
